<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard</title>
    <!-- <link rel="stylesheet" th:href="@{/css/style.css}"> -->
    <link rel="icon" type="image/png" th:href="@{/EM.png}">
    <link rel="stylesheet" th:href="@{/css/adminheader.css}">
    <style>
        /* =========================
           GLOBAL RESET & FONT
        ========================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f4f6f9, #e9eef5);
            color: #1f2937;

            display: flex;
            flex-direction: column;
        }


        .page-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 40px 20px;
        }

        /* =========================
           CONTAINER
        ========================= */
        .container {
            background: #ffffff;
            padding: 48px 56px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            max-width: 520px;
            width: 100%;
            text-align: center;
        }

        .container.master-container {
            max-width: 1080px;
        }

        /* =========================
           TITLE
        ========================= */
        .container h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 36px;
            line-height: 1.3;
        }

        .container h1 span {
            color: #2563eb;
            font-weight: 800;
        }

        /* =========================
           BUTTON GROUP
        ========================= */
        .dashboard-layout {
            display: block;
        }

        .dashboard-layout.master-layout {
            display: grid;
            grid-template-columns: minmax(300px, 360px) 1fr;
            gap: 20px;
            align-items: start;
            text-align: left;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 22px;
        }

        .dashboard-layout:not(.master-layout) .button-group {
            max-width: 620px;
            margin: 0 auto;
        }

        .chart-box {
            text-align: left;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            padding: 16px;
        }

        .chart-box h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        /* =========================
           BUTTONS
        ========================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
            transition: all 0.25s ease;
        }

        /* Hover & Active */
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.35);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
        }

        /* =========================
           RESPONSIVE
        ========================= */
        @media (max-width: 900px) {
            .dashboard-layout.master-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 36px 28px;
            }

            .container h1 {
                font-size: 22px;
            }
        }

    </style>
</head>
<body>
<div th:replace="~{fragments/admin_header :: mainHeader}"></div>

<div class="page-content">
    <div th:classappend="${isMaster} ? 'master-container' : ''" class="container">
        <h1>
            Welcome to Dashboard,
            <span th:text="${employeeName}">Employee</span>
        </h1>
        <div th:classappend="${isMaster} ? ' master-layout' : ''" class="dashboard-layout">
            <div class="button-group">
                <a th:if="${isMaster}" th:href="@{|/employees/${employeeId}/assign-job|}" class="btn">Job Assign (Self Assign)</a>
                <a th:href="@{|/employees/${employeeId}/current-jobs|}" class="btn">Mevcut İşlerim</a>
                <a th:href="@{|/employees/${employeeId}/completed-jobs|}" class="btn">Tamamlanan İşlerim</a>
                <a th:if="${!isMaster}" th:href="@{|/employees/${employeeId}/availability|}" class="btn">Availability</a>
            </div>

            <div class="chart-box" th:if="${isMaster}">
                <h3>Employee Çalışma Süresi</h3>
                <canvas id="masterWorkHoursBarChart"></canvas>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    const masterChartLabels = /*[[${masterChartEmployeeLabels}]]*/ [];
    const masterWeeklyWorkHourValues = /*[[${masterChartWeeklyWorkHourValues}]]*/ [];
    const masterMonthlyWorkHourValues = /*[[${masterChartMonthlyWorkHourValues}]]*/ [];

    if (masterChartLabels.length > 0 && document.getElementById('masterWorkHoursBarChart')) {
        new Chart(document.getElementById('masterWorkHoursBarChart'), {
            type: 'bar',
            data: {
                labels: masterChartLabels,
                datasets: [
                    {
                        label: 'Haftalık Çalışma Saati',
                        data: masterWeeklyWorkHourValues,
                        backgroundColor: '#60a5fa'
                    },
                    {
                        label: 'Aylık Çalışma Saati',
                        data: masterMonthlyWorkHourValues,
                        backgroundColor: '#34d399'
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }
</script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
