<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Self Assign Job</title>
  <link rel="icon" type="image/png" th:href="@{/EM.png}">
  <style>
    body { font-family: Inter, system-ui, sans-serif; background:#f4f6f8; color:#1f2937; margin:0; }
    .container { max-width: 900px; margin: 32px auto; padding: 0 20px; }
    .card { background:#fff; border-radius:16px; box-shadow:0 12px 26px rgba(0,0,0,.08); padding:24px; }
    h1 { margin:0 0 12px; }
    .back { display:inline-block; margin-bottom:16px; text-decoration:none; color:#374151; background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:8px 14px; }
    .form { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-group { display:flex; flex-direction:column; }
    .full { grid-column: span 2; }
    label { font-size:12px; color:#6b7280; font-weight:700; margin-bottom:6px; text-transform:uppercase; }
    input, select, textarea { border:1px solid #d1d5db; border-radius:10px; padding:10px 12px; font-size:14px; }
    .btn { grid-column: span 2; border:none; border-radius:12px; padding:12px; color:#fff; font-weight:700; background:linear-gradient(135deg,#2563eb,#1d4ed8); cursor:pointer; }
  </style>
</head>
<body>
<div class="container">
  <a class="back" th:href="@{|/employees/${employee.id}/dashboard|}">← Dashboard</a>
  <div class="card">
    <h1>Self Assign Job</h1>
    <form class="form" th:action="@{|/employees/${employee.id}/assign-job|}" th:object="${job}" method="post">
      <div class="form-group">
        <label>Tür</label>
        <select th:field="*{tur}" required>
          <option th:each="tur : ${turler}" th:value="${tur}" th:text="${tur}" th:if="${tur.name() != 'COWORK'}"></option>
        </select>
      </div>
      <div class="form-group">
        <label>Duvar Montajı</label>
        <select th:field="*{duvarMontaji}" required>
          <option value="true">Evet</option>
          <option value="false">Hayır</option>
        </select>
      </div>
      <div class="form-group">
        <label>İsim</label>
        <input type="text" th:field="*{isim}" required>
      </div>
      <div class="form-group">
        <label>Telefon</label>
        <input type="text" th:field="*{telNo}" required>
      </div>
      <div class="form-group full">
        <label>Adres</label>
        <input type="text" th:field="*{isAdresi}" required>
      </div>
      <div class="form-group full">
        <label>İş Tanımı</label>
        <textarea th:field="*{isTanimi}" required></textarea>
      </div>
      <div class="form-group">
        <label>Tarih</label>
        <input type="date" th:field="*{tarih}" required>
      </div>
      <div class="form-group">
        <label>Başlangıç Saati</label>
        <input type="time" th:field="*{baslangicSaati}" required>
      </div>
      <div class="form-group">
        <label>Tahmini Süre (Saat)</label>
        <input type="number" step="0.1" min="0.1" th:field="*{tahminiSure}" required>
      </div>
      <div class="form-group">
        <label>Ücret</label>
        <input type="number" step="0.01" min="0" th:field="*{ucret}" required>
      </div>
      <div class="form-group full">
        <label>Ücret Tahsil Tipi</label>
        <select th:field="*{ucretTahsilTipi}" required>
          <option th:each="tip : ${ucretTipleri}" th:value="${tip}" th:text="${tip}"></option>
        </select>
      </div>
      <button class="btn" type="submit">Assign Job</button>
    </form>
  </div>
</div>
</body>
</html>
