<!-- src/main/resources/templates/completed-jobs.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tamamlanan İşler</title>
    <link rel="icon" type="image/png" th:href="@{/EM.png}">

    <!-- Header CSS -->
    <style>
        /* =========================
           GLOBAL
        ========================= */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        /* =========================
           CONTAINER
        ========================= */
        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 24px;
        }

        /* =========================
           TITLE
        ========================= */
        .container h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 24px;
        }

        /* =========================
           BACK BUTTON
        ========================= */
        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #1f2937;
            margin-bottom: 16px;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }
        /* =========================
           FILTER BAR
        ========================= */
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search {
            position: relative;
            min-width: 280px;
            flex: 1;
            max-width: 420px;
        }

        .search input {
            width: 100%;
            height: 40px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 12px 0 38px;
            outline: none;
            background: #ffffff;
            font-size: 14px;
        }

        .search input:focus {
            border-color: rgba(37, 99, 235, 0.45);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .search .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            pointer-events: none;
            font-size: 14px;
        }


        /* =========================
           TABLE CARD
        ========================= */
        .table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            font-size: 14px;
        }

        /* =========================
           TABLE HEADER
        ========================= */
        .table thead {
            background: #2563eb;
            color: #ffffff;
        }

        .table thead th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 700;
            white-space: nowrap;
        }

        /* =========================
           TABLE BODY
        ========================= */
        .table tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Zebra rows */
        .table tbody tr:nth-child(even) {
            background: #f9fafb;
        }

        /* Hover */
        .table tbody tr:hover {
            background: #eef2ff;
        }

        /* =========================
           STATUS COLORS (EVET / HAYIR)
        ========================= */
        .table td {
            font-weight: 500;
        }
        /* =========================
           PREVIEW MODAL
        ========================= */
        .preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .preview-overlay.hidden {
            display: none;
        }

        .preview-modal {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            animation: scaleIn 0.2s ease;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .preview-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .close-btn {
            border: none;
            background: transparent;
            font-size: 20px;
            cursor: pointer;
        }

        .preview-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .preview-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 16px;
            padding: 10px 0;
            border-bottom: 1px dashed #e5e7eb;
            align-items: flex-start;
        }

        .preview-label {
            font-weight: 700;
            color: #475569;
        }

        .preview-value {
            color: #111827;
            line-height: 1.5;
            word-break: break-word;
        }

        .preview-desc .preview-value {
            background: #f8fafc;
            padding: 12px;
            border-radius: 10px;
            font-size: 13.5px;
        }


        @keyframes scaleIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }


        /* =========================
           RESPONSIVE
        ========================= */
        @media (max-width: 1000px) {
            .table {
                display: block;
                overflow-x: auto;
            }
        }

    </style>
</head>
<!-- JOB PREVIEW MODAL -->
<div id="jobPreviewOverlay" class="preview-overlay hidden">
    <div class="preview-modal">
        <div class="preview-header">
            <h2>İş Detayı</h2>
            <button class="close-btn" onclick="closePreview()">✕</button>
        </div>

        <div class="preview-content" id="previewContent">
            <!-- Filled dynamically -->
        </div>
    </div>
</div>

<body>
<div th:replace="~{fragments/admin_header :: mainHeader}"></div>
<div class="container">
    <h1>Tamamlanan İşlerim</h1>

    <div class="actions">
        <a th:href="@{|/employees/${employeeId}/dashboard|}" class="btn btn-secondary">Geri Dön</a>
        <div class="search">
            <span class="icon">🔎</span>
            <input id="searchInput" type="text" placeholder="Tür / adres / tarih ara...">
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <label for="jobsPageSize">Visible:</label>
            <select id="jobsPageSize">
                <option value="20" selected>20</option>
                <option value="30">30</option>
                <option value="50">50</option>
            </select>
            <button type="button" class="btn btn-small" id="jobsPrevBtn">Prev</button>
            <span id="jobsPageInfo">Page 1 / 1</span>
            <button type="button" class="btn btn-small" id="jobsNextBtn">Next</button>
        </div>
    </div>

    <table class="table" id="completedJobsTable">
        <thead>
        <tr>
            <th>Tür</th>
            <th>Duvar Montajı</th>
            <th>İş Adresi</th>
            <th>Tanımı</th>
            <th>Tarih</th>
            <th>Ücret</th>
            <th>Ücret Tahsili</th>
            <th>Süre (Saat)</th>
            <th>Bahşiş</th>
            <th>Kart Verildi</th>
            <th>Yorum Kartı</th>
            <th>Foto Atıldı</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="job : ${jobs}"
            onclick="openPreview(this)"
            style="cursor:pointer"
            th:data-tur="${job.tur}"
            th:data-duvar="${job.duvarMontaji}"
            th:data-adres="${job.isAdresi}"
            th:data-tanimi="${job.tanimi}"
            th:data-tarih="${#temporals.format(job.tarih, 'dd.MM.yyyy')}"
            th:data-ucret="${job.ucret}"
            th:data-tahsil="${job.ucretTahsilTipi}"
            th:data-sure="${job.sure}"
            th:data-bahsis="${job.bahsis}"
            th:data-kart="${job.kartVerildi}"
            th:data-yorum="${job.yorumKartiVerildi}"
            th:data-foto="${job.fotoAtildi}">
            <td th:text="${job.tur}"></td>
            <td th:text="${job.duvarMontaji} ? 'Evet' : 'Hayır'"></td>
            <td th:text="${job.isAdresi}"></td>
            <td th:text="${job.tanimi}"></td>
            <td th:text="${#temporals.format(job.tarih, 'dd.MM.yyyy')}"></td>
            <td th:text="${job.ucret}"></td>
            <td th:text="${job.ucretTahsilTipi}"></td>
            <td th:text="${#numbers.formatDecimal(job.sure, 1, 2)}"></td>
            <td th:text="${job.bahsis}"></td>
            <td th:text="${job.kartVerildi} ? 'Evet' : 'Hayır'"></td>
            <td th:text="${job.yorumKartiVerildi} ? 'Evet' : 'Hayır'"></td>
            <td th:text="${job.fotoAtildi} ? 'Evet' : 'Hayır'"></td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/main.js}"></script>
<script>
    const searchInput = document.getElementById("searchInput");
    const completedJobsTable = document.getElementById("completedJobsTable");
    const jobsPageSizeSelect = document.getElementById("jobsPageSize");
    const jobsPrevBtn = document.getElementById("jobsPrevBtn");
    const jobsNextBtn = document.getElementById("jobsNextBtn");
    const jobsPageInfo = document.getElementById("jobsPageInfo");
    let jobsCurrentPage = 1;
    const getJobsPageSize = () => Number(jobsPageSizeSelect?.value || 20);

    const renderJobsPage = () => {
        if (!completedJobsTable) return;
        const tbody = completedJobsTable.querySelector("tbody");
        if (!tbody) return;

        const rows = Array.from(tbody.querySelectorAll("tr"));
        const filteredRows = rows.filter((row) => row.dataset.matchesSearch !== "false");
        const pageSize = getJobsPageSize();
        const totalPages = Math.max(1, Math.ceil(filteredRows.length / pageSize));
        jobsCurrentPage = Math.min(jobsCurrentPage, totalPages);

        const start = (jobsCurrentPage - 1) * pageSize;
        const end = start + pageSize;

        rows.forEach((row) => {
            row.style.display = "none";
        });
        filteredRows.forEach((row, index) => {
            row.style.display = index >= start && index < end ? "" : "none";
        });

        if (jobsPageInfo) jobsPageInfo.textContent = `Page ${jobsCurrentPage} / ${totalPages}`;
        if (jobsPrevBtn) jobsPrevBtn.disabled = jobsCurrentPage <= 1;
        if (jobsNextBtn) jobsNextBtn.disabled = jobsCurrentPage >= totalPages;
    };

    const applySearchFilter = () => {
        if (!completedJobsTable) return;
        const query = (searchInput?.value || "").trim().toLowerCase();
        const rows = completedJobsTable.querySelectorAll("tbody tr");
        rows.forEach((row) => {
            const rowText = row.innerText.toLowerCase();
            row.dataset.matchesSearch = rowText.includes(query) ? "true" : "false";
        });
        jobsCurrentPage = 1;
        renderJobsPage();
    };

    if(searchInput && completedJobsTable){
        searchInput.addEventListener("keyup", applySearchFilter);
    }
    if (jobsPrevBtn) {
        jobsPrevBtn.addEventListener("click", () => {
            if (jobsCurrentPage > 1) {
                jobsCurrentPage--;
                renderJobsPage();
            }
        });
    }
    if (jobsNextBtn) {
        jobsNextBtn.addEventListener("click", () => {
            jobsCurrentPage++;
            renderJobsPage();
        });
    }
    if (jobsPageSizeSelect) {
        jobsPageSizeSelect.addEventListener("change", () => {
            jobsCurrentPage = 1;
            renderJobsPage();
        });
    }

    function openPreview(row) {
        const content = document.getElementById("previewContent");
        const fields = row.dataset;

        const labelMap = {
            tur: "Tür",
            duvar: "Duvar Montajı",
            adres: "İş Adresi",
            tanimi: "İş Tanımı",
            tarih: "Tarih",
            ucret: "Ücret",
            tahsil: "Ücret Tahsili",
            sure: "Süre (Saat)",
            bahsis: "Bahşiş",
            kart: "Kart Verildi",
            yorum: "Yorum Kartı",
            foto: "Foto Atıldı"
        };

        const valueMap = (key, value) => {
            if (value === "true") return "Evet";
            if (value === "false") return "Hayır";
            return value;
        };

        let html = "";
        for (const key in fields) {
            html += `
                <div class="preview-row ${key === 'tanimi' ? 'preview-desc' : ''}">
                    <div class="preview-label">${labelMap[key] ?? key}</div>
                    <div class="preview-value">${valueMap(key, fields[key])}</div>
                </div>
            `;
        }

        content.innerHTML = html;
        document.getElementById("jobPreviewOverlay").classList.remove("hidden");
    }

    function closePreview() {
        document.getElementById("jobPreviewOverlay").classList.add("hidden");
    }
    applySearchFilter();
</script>

</body>
</html>
